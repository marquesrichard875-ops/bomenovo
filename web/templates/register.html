{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Criar conta</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome
      <input type="text" name="name" value="{{ name }}" minlength="2" maxlength="100" required autofocus>
    </label>
    <label>E-mail
      <input type="email" name="email" value="{{ email }}" required>
    </label>
    <label>Senha <small class="muted">(6 a 72 caracteres)</small>
      <input type="password" name="password" minlength="6" maxlength="72" required>
    </label>
    <label>Confirmar senha
      <input type="password" name="confirm" minlength="6" maxlength="72" required>
    </label>
    <button class="btn" type="submit">Cadastrar</button>
  </form>
  <p class="muted">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</section>
{% endblock %}
